<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174af5" />
    <meta name="description" content="BENVE. Vestidos de fiesta." />
    <title>BENVE — vestidos de fiesta</title>
    <link rel="icon" type="image/svg+xml" href="/images/benve-icon.svg" />
    <link rel="stylesheet" href="/src/benve.css" />
  </head>
  <body>
    <header class="benve-header">
      <a class="benve-wordmark" href="/benve/" aria-label="BENVE, inicio"
        >BENVE<svg
          viewBox="0 0 20 20"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          aria-hidden="true"
        >
          <path d="M5 15 15 5M5 5h10v10" /></svg
      ></a>
      <a class="benve-back" href="/"
        >Volver a SI.gov
        <svg
          viewBox="0 0 20 20"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          aria-hidden="true"
        >
          <path d="M15 10H5m5-5-5 5 5 5" /></svg
      ></a>
    </header>
    <nav class="page-nav" aria-label="Páginas del sitio">
      <a href="/" aria-label="SI.gov, inicio"><span class="page-nav-index" aria-hidden="true">01</span><span class="page-nav-label">SI.gov</span></a>
      <a href="/benve/" aria-label="BENVE, vestidos de fiesta" aria-current="page"><span class="page-nav-index" aria-hidden="true">02</span><span class="page-nav-label">BENVE</span></a>
      <a href="/initiatives/education/" aria-label="Educación"><span class="page-nav-index" aria-hidden="true">03</span><span class="page-nav-label">Educación</span></a>
      <a href="/initiatives/presidential-challenge/" aria-label="Presidential SI Challenge"><span class="page-nav-index" aria-hidden="true">04</span><span class="page-nav-label">Challenge</span></a>
      <a href="/atenea/" aria-label="ATENEA, marketing digital"><span class="page-nav-index" aria-hidden="true">05</span><span class="page-nav-label">ATENEA</span></a>
    </nav>
    <main id="benve-story" class="benve-main" aria-labelledby="benve-title">
      <div class="benve-stage">
        <canvas
          id="benve-canvas"
          tabindex="0"
          role="img"
          aria-label="Puntos que forman el logo circular BENVE y la palabra BENVE en blanco, y dos vestidos modernos en blanco y lavanda al bajar por la página. Mové el mouse para interactuar o pulsá Enter para crear una onda."
        ></canvas>
        <span class="benve-cursor" aria-hidden="true"></span>
      </div>
      <section id="benve-intro" class="benve-panel" data-particle-scene="logo">
        <div class="benve-copy">
          <h1 id="benve-title">BENVE</h1>
          <p>vestidos de fiesta</p>
        </div>
        <div class="benve-anchor" data-particle-anchor="logo" aria-hidden="true"></div>
      </section>
      <section id="benve-word" class="benve-panel benve-panel-left" data-particle-scene="word" aria-labelledby="benve-word-title">
        <h2 id="benve-word-title" class="sr-only">BENVE en puntos</h2>
        <div class="benve-anchor benve-anchor-word" data-particle-anchor="word" aria-hidden="true"></div>
      </section>
      <section id="benve-dress" class="benve-panel benve-panel-left" data-particle-scene="dress" aria-labelledby="benve-dress-title">
        <h2 id="benve-dress-title" class="sr-only">Vestido minimalista de un hombro en puntos blancos y lavanda</h2>
        <div class="benve-anchor" data-particle-anchor="dress" aria-hidden="true"></div>
      </section>
      <section id="benve-dress-two" class="benve-panel benve-panel-right" data-particle-scene="dress-two" aria-labelledby="benve-dress-two-title">
        <h2 id="benve-dress-two-title" class="sr-only">Vestido de escote halter y caída sirena en puntos blancos y lavanda</h2>
        <div class="benve-anchor" data-particle-anchor="dress-two" aria-hidden="true"></div>
      </section>
    </main>
    <footer class="benve-footer">
      <p class="benve-hint">
        <span class="hint-dot" aria-hidden="true"></span>Bajá para descubrir
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" aria-hidden="true"><path d="M8 2v12m-4-4 4 4 4-4" /></svg>
      </p>
      <button
        id="benve-reset"
        type="button"
        aria-label="Recomponer la figura de puntos"
      >
        Recomponer
        <svg
          viewBox="0 0 20 20"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.25"
          aria-hidden="true"
        >
          <path d="M15 6a6 6 0 1 0 1 7M15 2v5h-5" />
        </svg>
      </button>
    </footer>
    <script type="module" src="/src/benve.js"></script>
  </body>
</html>
